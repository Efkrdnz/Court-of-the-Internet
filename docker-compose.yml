# Local PostgreSQL for development: `npm run db:up`
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: court
      POSTGRES_PASSWORD: court
      POSTGRES_DB: court_dev
    ports:
      - "5432:5432"
    volumes:
      - court-db:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U court -d court_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  court-db:
